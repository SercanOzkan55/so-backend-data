<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SÖ — Backend &amp; Data</title>
    <meta
      name="description"
      content="The first live milestone for SÖ's backend and data portfolio."
    />
    <style>
      :root {
        --paper: #f3f6f5;
        --ink: #12181b;
        --signal: #1f6f63;
        --stamp: #b5502e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
        padding: clamp(1.5rem, 5vw, 4rem);
      }

      section {
        align-self: center;
      }

      .status,
      footer {
        font-family: "IBM Plex Mono", Consolas, monospace;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.7rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.5rem;
        color: var(--signal);
      }

      .status span {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: 0 0 0 0.25rem rgb(31 111 99 / 12%);
      }

      h1 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(5rem, 22vw, 14rem);
        font-weight: 600;
        letter-spacing: -0.08em;
        line-height: 0.75;
      }

      .note {
        max-width: 34rem;
        margin: 2rem 0 0;
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.5;
      }

      footer {
        justify-self: end;
        color: var(--stamp);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #12181b;
          --ink: #f3f6f5;
          --signal: #68b5a8;
          --stamp: #db7957;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="name">
        <p class="status"><span aria-hidden="true"></span>Live</p>
        <h1 id="name">SÖ</h1>
        <p class="note">Backend &amp; data portfolio — taking shape.</p>
      </section>
      <footer>Est. 2026</footer>
    </main>
  </body>
</html>
